<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q&amp;A｜学校薬剤師支援サイト</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-top">
    <a class="brand" href="../index.html">
      <span class="mark">学校薬剤師支援サイト</span>
      <span class="sub">SCHOOL PHARMACIST FIELD BINDER</span>
    </a>
    <div class="header-meta" id="today-label"></div>
  </div>
  <nav class="tabnav" aria-label="サイト内ナビゲーション">
    <a href="../index.html">🏠 ホーム</a>
    <a href="schedule.html" data-cat="schedule">📅 年間予定</a>
    <a href="pool.html">🏊 プール水検査</a>
    <a href="mite.html" data-cat="mite">🪳 ダニ検査</a>
    <a href="kitchen.html" data-cat="kitchen">🍚 給食室検査</a>
    <a href="air.html" data-cat="air">🌬 空気・騒音検査</a>
    <a href="newsletter.html">📄 保健だより</a>
    <a href="qa.html">❓ Q&amp;A</a>
  </nav>
</header>

<div class="binder">
  <div class="binder-holes"></div>
  <main>

    <section class="page-head">
      <p class="eyebrow">Q &amp; A</p>
      <h1>❓ よくある質問</h1>
      <p>日々の業務や勉強会で出てきた疑問をまとめています。キーワードで検索するか、カテゴリで絞り込んでください。</p>
    </section>

    <div class="qa-search">
      <input type="text" id="qa-search" placeholder="例）プール、ダニ、照度 など">
      <select id="qa-cat" style="border:1px solid var(--line);border-radius:4px;padding:0 10px;">
        <option value="">すべてのカテゴリ</option>
      </select>
    </div>

    <div id="qa-list"></div>
    <p class="empty-note" id="qa-empty" style="display:none;">該当する質問が見つかりませんでした。</p>

  </main>
</div>

<footer class="site-footer">
  <div class="binder">
    <p>学校薬剤師支援サイト（個人運営・学習用プロジェクト）／記録データはお使いの端末内にのみ保存されます　&copy; <span class="footer-year"></span></p>
  </div>
</footer>

<script src="../js/app.js"></script>
<script>
const FALLBACK_QA = [
  { category: "プール", q: "プール水の遊離残留塩素はどのくらいの頻度で測定しますか？", a: "使用日は原則として毎日、使用前に測定します。利用者が多い日は使用中にも複数回測定するのが望ましいとされています。" },
  { category: "プール", q: "遊離残留塩素が基準値を下回っていた場合はどうすればいいですか？", a: "速やかに塩素剤を追加し、再測定してから利用を再開します。基準を満たすまでは遊泳を控えるよう学校側に伝えます。" },
  { category: "ダニ", q: "ダニ検査はどの時期に行うのが効果的ですか？", a: "気温・湿度が高くなる梅雨明けから夏にかけてダニが増殖しやすいため、6〜9月頃の実施が効果的とされています。" },
  { category: "ダニ", q: "ダニアレルゲン検査キットにはどんな種類がありますか？", a: "抗原量を測定するイムノクロマト法のキットや、顕微鏡で虫体数を数える方法などがあります。学校や自治体の方針に沿ったキットを使用します。" },
  { category: "給食室", q: "給食室の照度基準はどのくらいですか？", a: "調理作業面はおおむね300ルクス以上が目安とされています。詳細は学校環境衛生基準の原文をご確認ください。" },
  { category: "給食室", q: "害虫の痕跡を見つけたときはまず何をすべきですか？", a: "発生場所と状況を記録し、栄養教諭・調理員と共有した上で、駆除業者への相談や清掃頻度の見直しを提案します。" },
  { category: "空気・騒音", q: "教室のCO2濃度が高い場合、まず何を確認しますか？", a: "換気の頻度と方法（窓の開閉、換気扇の稼働）を確認し、休み時間ごとの換気を徹底するよう助言します。" },
  { category: "空気・騒音", q: "騒音測定はどんなタイミングで行いますか？", a: "窓を閉めた状態・開けた状態の両方で測定し、周辺の交通量なども記録しておくと比較しやすくなります。" },
  { category: "全般", q: "検査記録はどのくらいの期間保存すればいいですか？", a: "学校保健安全法関連の記録は、各自治体・学校の文書管理規程に従って保存します。一般的には数年単位での保存が推奨されています。" },
  { category: "全般", q: "このサイトのデータはどこに保存されますか？", a: "現在の記録フォームは、入力した端末のブラウザ内（localStorage）にのみ保存されます。他の端末とは共有されないため、必要に応じてCSV書き出しでバックアップしてください。" },
];

let ALL_QA = [];

function populateCategories(items){
  const sel = document.getElementById("qa-cat");
  const cats = [...new Set(items.map((i) => i.category))];
  cats.forEach((c) => {
    const opt = document.createElement("option");
    opt.value = c;
    opt.textContent = c;
    sel.appendChild(opt);
  });
}

function renderQA(){
  const keyword = document.getElementById("qa-search").value.trim().toLowerCase();
  const cat = document.getElementById("qa-cat").value;
  const list = document.getElementById("qa-list");
  const empty = document.getElementById("qa-empty");

  const filtered = ALL_QA.filter((item) => {
    const matchCat = !cat || item.category === cat;
    const matchWord = !keyword || (item.q + item.a).toLowerCase().includes(keyword);
    return matchCat && matchWord;
  });

  list.innerHTML = "";
  empty.style.display = filtered.length ? "none" : "block";
  filtered.forEach((item) => {
    const details = document.createElement("details");
    details.className = "qa-item";
    details.innerHTML = `
      <summary>${item.q}<span class="qa-cat">${item.category}</span></summary>
      <div class="a">${item.a}</div>
    `;
    list.appendChild(details);
  });
}

document.getElementById("qa-search").addEventListener("input", renderQA);
document.getElementById("qa-cat").addEventListener("change", renderQA);

fetch("../data/qa.json")
  .then((res) => { if (!res.ok) throw new Error("not found"); return res.json(); })
  .then((data) => { ALL_QA = data; populateCategories(ALL_QA); renderQA(); })
  .catch(() => { ALL_QA = FALLBACK_QA; populateCategories(ALL_QA); renderQA(); });
</script>
</body>
</html>
